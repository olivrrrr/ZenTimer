<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">ZenTimer: geplanter Anschluss von LCD und Touch an XIAO nRF52840</title>
<desc id="desc">Logische Verbindungsskizze der zwölf Displaykontakte. Die Pinpositionen am XIAO sind nicht maßstäblich und stellen keine physische Padreihenfolge dar. Farben unterscheiden Signalgruppen und sind keine Kabelfarben. Konkretes Modul und Kabel noch unbestätigt.</desc>
<rect width="1200" height="1030" rx="20" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172033">
<text x="52" y="57" font-size="30" font-weight="700">ZenTimer · LCD + Touch anschließen</text>
<text x="52" y="91" font-size="18">Anschlussentwurf · konkrete Modul- und Kabelvariante noch bestätigen</text>
<rect x="52" y="116" width="1096" height="58" rx="10" fill="#fff3db"/>
<text x="72" y="140" font-size="16" font-weight="700">Nur stromlos: USB abziehen und Akku trennen.</text>
<text x="72" y="162" font-size="16">Farben = Signalgruppen, keine Kabelfarben. Pinpositionen rechts sind nur schematisch.</text>
<rect x="52" y="196" width="365" height="723" rx="14" fill="white" stroke="#cbd5e1"/>
